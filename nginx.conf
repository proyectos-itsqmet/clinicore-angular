server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Manejo de rutas de Angular SPA
    location / {
        # Esta es la línea que maneja la recarga de la página (F5) para que siempre devuelva el index.html
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # Bloque preparado para tus futuras peticiones al backend
