<div class="flex flex-wrap items-end justify-between gap-6">
  <div class="flex flex-col gap-[14px]">
    @if (kicker(); as kickerText) {
      <app-kicker [tone]="kickerTone()">{{ kickerText }}</app-kicker>
    }
    <h2 class="text-h2 font-display text-ink">{{ heading() }}</h2>
  </div>
  @if (note(); as noteText) {
    <span class="text-cap font-sans text-ink-3">{{ noteText }}</span>
  }
</div>
