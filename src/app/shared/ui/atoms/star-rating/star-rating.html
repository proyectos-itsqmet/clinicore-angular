<div class="inline-flex items-center gap-[3px]" role="img" [attr.aria-label]="ariaLabel()">
  @for (index of starIndexes(); track index) {
    <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient [attr.id]="gradientId(index)">
          <stop [attr.offset]="fraction(index) * 100 + '%'" stop-color="var(--color-star)" />
          <stop [attr.offset]="fraction(index) * 100 + '%'" stop-color="transparent" />
        </linearGradient>
      </defs>
      <path
        d="m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"
        [attr.fill]="'url(#' + gradientId(index) + ')'"
        stroke="var(--color-star-ring)"
        stroke-width="1.1"
      />
    </svg>
  }
</div>
