<div class="wrap mx-auto w-full max-w-[1240px] px-5 md:px-0">
  <div class="grid grid-cols-2 gap-3 md:grid-cols-4 md:gap-4" [attr.aria-busy]="loading() ? true : null">
    @if (loading()) {
      @for (i of skeletonItems; track i) {
        <app-access-tile [item]="emptyItem" [icon]="iconFor(emptyItem, i)" [loading]="true" />
      }
    } @else {
      @for (item of quickAccess().items; track item.id; let i = $index) {
        <app-access-tile [item]="item" [icon]="iconFor(item, i)" [loading]="false" />
      }
    }
  </div>
</div>
