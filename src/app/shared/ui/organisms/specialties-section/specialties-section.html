<section
  class="bg-cream px-5 py-12 md:px-0 md:py-[88px]"
  [attr.aria-busy]="loading() ? true : null"
>
  <div class="mx-auto flex w-full max-w-[1240px] flex-col gap-5 md:gap-[34px]">
    <div class="flex flex-col gap-3.5 md:flex-row md:items-end md:justify-between md:gap-12">
      <div class="flex max-w-[620px] flex-col gap-3.5">
        @if (loading()) {
          <app-skeleton variant="text" width="130px" height="20px" />
          <div class="flex w-full flex-col md:w-[600px]">
            <app-skeleton variant="text" width="100%" height="49px" />
            <span class="block md:hidden">
              <app-skeleton variant="text" width="68%" height="49px" />
            </span>
          </div>
        } @else {
          <app-kicker tone="gold">{{ specialties().header.kicker }}</app-kicker>
          <h2 class="text-h2 font-display text-ink">{{ specialties().header.title }}</h2>
        }
      </div>

      @if (loading()) {
        <div class="w-full md:w-[358px]">
          <app-skeleton variant="pill" width="100%" height="54px" />
        </div>
      } @else {
        <app-segmented
          [options]="groupLabels()"
          [selectedIndex]="selectedGroupIndex()"
          (selectedIndexChange)="selectedGroupIndex.set($event)"
        />
      }
    </div>

    <div
      class="grid grid-cols-1 gap-3.5 md:grid-cols-3 md:gap-5"
      [attr.aria-busy]="loading() ? true : null"
    >
      @if (loading()) {
        @for (i of skeletonItems; track i) {
          <app-specialty-card [specialty]="emptySpecialty" [loading]="true" />
        }
      } @else {
        @for (specialty of activeSpecialties(); track specialty.id) {
          <app-specialty-card [specialty]="specialty" [loading]="false" />
        }
      }
    </div>
  </div>
</section>
