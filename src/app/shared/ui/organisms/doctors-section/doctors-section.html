<section class="bg-field px-5 py-12 md:px-0 md:py-[88px]" [attr.aria-busy]="loading() ? true : null">
  <div class="mx-auto flex w-full max-w-[1240px] flex-col gap-5 md:gap-[34px]">
    <div class="flex flex-col gap-3.5 md:flex-row md:items-end md:justify-between md:gap-12">
      <div class="flex max-w-[620px] flex-col gap-3.5">
        @if (loading()) {
          <!-- 20px kicker / 49px heading lines, both measured off the real line boxes:
               `text-kicker` declares no line-height, so the preflight's
               `html { line-height: 1.5 }` gives 13 x 1.5 = 19.5px, and `text-h2` is
               44 x 1.12 = 49.28px at every breakpoint (there is no responsive
               override of the token). "Quién te va a atender." is TWO of those lines
               in the 350px mobile box (a 390px viewport minus `px-5`) and ONE in the
               620px md: column, so the second bar is `md:hidden` — 98.53px reserved
               at mobile, 49.28px at md:. The pair sits in a GAPLESS `flex-col`, the
               shape `booking-section.html` already ships, because consecutive line
               boxes are contiguous; the atom's own `lines` input would insert its 8px
               `gap-2` between them.
               Every width lives on a plain wrapper, not on the atom
               (`display: contents` host) and not as a bare percentage: this column is
               a flex item of a `md:flex-row` row, so at md: it is shrink-to-fit and a
               `%`-only bar contributes 0 to max-content — the column would collapse
               to the kicker's 150px. -->
          <app-skeleton variant="text" width="150px" height="20px" />
          <div class="flex w-full flex-col md:w-[500px]">
            <app-skeleton variant="text" width="100%" height="49px" />
            <span class="block md:hidden">
              <app-skeleton variant="text" width="48%" height="49px" />
            </span>
          </div>
        } @else {
          <app-kicker>{{ doctors().header.kicker }}</app-kicker>
          <h2 class="text-h2 font-display text-ink">{{ doctors().header.title }}</h2>
        }
      </div>
      @if (!loading()) {
        <a
          [href]="doctors().header.viewAllHref"
          class="hidden min-h-11 items-center gap-2.5 text-[16px] font-bold text-blue-text no-underline md:inline-flex"
        >
          <span>Ver los {{ doctors().header.totalCount }} especialistas</span>
          <app-icon name="arrow" [size]="18" [strokeWidth]="2.2" />
        </a>
      }
    </div>

    <div
      class="-mx-5 flex snap-x snap-mandatory gap-3 overflow-x-auto px-5 pb-1 md:mx-0 md:grid md:grid-cols-4 md:gap-5 md:overflow-visible md:px-0 md:pb-0"
      [attr.aria-busy]="loading() ? true : null"
    >
      @if (loading()) {
        @for (i of skeletonItems; track i) {
          <div class="w-[78%] shrink-0 snap-start md:contents">
            <app-doctor-card [doctor]="emptyDoctor" [loading]="true" />
          </div>
        }
      } @else {
        @for (doctor of doctors().items; track doctor.id) {
          <div class="w-[78%] shrink-0 snap-start md:contents">
            <app-doctor-card [doctor]="doctor" [loading]="false" />
          </div>
        }
      }
    </div>
  </div>
</section>
