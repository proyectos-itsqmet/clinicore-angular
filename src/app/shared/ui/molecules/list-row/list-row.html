<div [class]="rootClasses()">
  <ng-content select="[rowLeading]" />

  <div class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="truncate font-sans text-[14px] font-semibold leading-[1.35] text-ink">{{
      title()
    }}</span>
    @if (subtitle(); as second) {
      <span class="truncate font-sans text-[12.5px] leading-[1.4] text-ink-3">{{ second }}</span>
    }
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <ng-content select="[rowTrailing]" />
  </div>
</div>
