@if (loading()) {
  <app-card padding="24px">
    <div class="flex flex-col gap-3.5" aria-busy="true">
      <app-skeleton variant="text" width="90px" height="16px" />
      <app-skeleton variant="text" [lines]="3" />
      <div class="mt-auto flex items-center gap-2.5">
        <app-skeleton variant="circle" width="38px" />
        <app-skeleton variant="text" width="120px" />
      </div>
    </div>
  </app-card>
} @else {
  <app-card padding="24px">
    <div class="flex flex-col gap-3.5">
      <div class="flex items-center justify-between gap-3">
        <app-star-rating [value]="review().rating" [size]="16" />
        <app-pill tone="plain">{{ source() }}</app-pill>
      </div>
      <span class="text-body text-[16px] text-ink">{{ review().text }}</span>
      <span class="mt-auto flex items-center gap-2.5">
        <span class="h-[38px] w-[38px] shrink-0 overflow-hidden rounded-full">
          <img [src]="review().avatar | assetUrl" alt="" class="h-[38px] w-[38px] object-cover" />
        </span>
        <span class="flex flex-col">
          <span class="text-meta font-bold text-ink">{{ review().authorName }}</span>
          <span class="text-cap text-ink-3">{{ review().authorContext }} · {{ relativeDate() }}</span>
        </span>
      </span>
    </div>
  </app-card>
}
