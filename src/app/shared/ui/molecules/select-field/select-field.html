<!--
  El disparador. Un `<button type="button">`, nunca un div: trae el foco, la
  activación con Enter/Espacio y el rol correcto sin pedir nada. `type` explícito
  porque dentro de un `<form>` un botón sin tipo ES un submit, y elegir del
  desplegable enviaría el formulario.
-->
<button
  #trigger
  type="button"
  [id]="inputId()"
  [disabled]="isDisabled()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  class="flex w-full items-center justify-between gap-2 rounded-xl border bg-surface px-3.5 py-2.5 text-left text-sm transition-all disabled:cursor-not-allowed disabled:bg-field disabled:text-ink-3"
  [class.border-line]="!invalid() && !open()"
  [class.border-blue]="open() && !invalid()"
  [class.ring-2]="open() && !invalid()"
  [class.ring-blue\/20]="open() && !invalid()"
  [class.border-emergency]="invalid()"
  [class.text-ink]="selected()"
  [class.text-ink-3]="!selected()"
>
  <span class="truncate">{{ triggerLabel() }}</span>

  <!--
    El chevron rota al abrir. Es la única señal de estado que queda una vez que
    el panel del sistema operativo ya no existe, así que gira de verdad en vez
    de cambiar de glifo.
  -->
  <svg
    class="h-4 w-4 shrink-0 text-ink-3 transition-transform duration-200"
    [class.rotate-180]="open()"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
  </svg>
</button>

<!--
  El panel es un `ng-template` y NO parte del árbol de este componente: se
  monta a mano en `<body>` al abrir. Ver `SelectField.panelView` para el
  porqué — la versión corta es que `absolute` lo recortaba cualquier ancestro
  con `overflow-hidden`, y `fixed` tampoco alcanzaba porque los modales de
  este panel llevan `transform`, que crea un bloque contenedor nuevo.

  Al estar en `<body>` las coordenadas son de viewport, así que `top`/`left`/
  `width` los calcula `reposition()` desde el rectángulo del disparador — y
  los recalcula en cada scroll y resize mientras está abierto.
-->
<ng-template #panelTpl>
  <div
    role="listbox"
    [attr.aria-labelledby]="inputId()"
    class="fixed z-[1000] overflow-y-auto rounded-xl border border-line bg-surface py-1.5 shadow-lift-2"
    [style.top.px]="panelBox().top"
    [style.left.px]="panelBox().left"
    [style.width.px]="panelBox().width"
    [style.max-height.px]="panelBox().maxHeight"
  >
    @if (options().length === 0) {
      <p class="px-3.5 py-2 text-xs text-ink-3">No hay opciones disponibles.</p>
    }

    @for (option of options(); track option.value; let i = $index) {
      <!--
        `(pointerdown)` con `preventDefault`, no `(click)`: el clic saca el foco
        del disparador antes de que corra el handler, y el cierre por clic-afuera
        del host llegaba primero en algunos navegadores. Frenar el pointerdown
        deja el foco donde está y hace la selección determinista.

        Y es un div con `role="option"`, no un botón: dentro de un `listbox` los
        hijos deben ser `option`, y un `<button role="option">` le miente al
        lector de pantalla sobre lo que puede hacer.
      -->
      <div
        [id]="optionId(i)"
        role="option"
        [attr.aria-selected]="option.value === selected()?.value"
        [attr.aria-disabled]="option.disabled ? 'true' : null"
        (pointerdown)="$event.preventDefault(); select(option)"
        (pointerenter)="!option.disabled && activeIndex.set(i)"
        class="flex cursor-pointer flex-col px-3.5 py-2 text-sm transition-colors"
        [class.bg-tint]="i === activeIndex() && !option.disabled"
        [class.text-blue-text]="option.value === selected()?.value && !option.disabled"
        [class.font-bold]="option.value === selected()?.value"
        [class.text-ink]="option.value !== selected()?.value && !option.disabled"
        [class.cursor-not-allowed]="option.disabled"
        [class.text-ink-3]="option.disabled"
      >
        <span class="truncate">{{ option.label }}</span>
        @if (option.hint) {
          <span class="truncate text-[11px] text-ink-3">{{ option.hint }}</span>
        }
      </div>
    }
  </div>
</ng-template>
