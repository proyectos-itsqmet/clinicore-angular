@if (loading()) {
  <app-card>
    <div cardMedia>
      <app-skeleton variant="block" width="100%" height="200px" radius="0" />
    </div>
    <div class="flex flex-col gap-2.5" style="padding: 22px" aria-busy="true">
      <app-skeleton variant="text" width="65%" height="19px" />
      <app-skeleton variant="text" [lines]="2" />
    </div>
  </app-card>
} @else {
  <app-card>
    <div cardMedia class="relative">
      <img [src]="step().image | assetUrl" alt="" class="h-[200px] w-full object-cover" />
      <span
        class="absolute bottom-3.5 left-[18px] font-display text-[46px] font-extrabold text-surface"
        style="text-shadow: 0 2px 12px rgb(12 43 75 / .6)"
        >{{ paddedNumber() }}</span
      >
    </div>
    <div class="flex flex-col gap-2.5" style="padding: 22px">
      <span class="font-display text-h3 text-ink">{{ step().title }}</span>
      <span class="text-body text-[16px] text-ink-2">{{ step().description }}</span>
    </div>
  </app-card>
}
