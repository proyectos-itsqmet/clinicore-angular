@if (loading()) {
  <app-card>
    <div cardMedia>
      <app-skeleton variant="block" width="100%" height="203px" radius="0" />
    </div>
    <div class="flex flex-col gap-2" style="padding: 20px" aria-busy="true">
      <app-skeleton variant="text" width="55%" height="17px" />
      <app-skeleton variant="text" [lines]="2" />
    </div>
  </app-card>
} @else {
  <app-card>
    <img cardMedia [src]="image() | assetUrl" alt="" class="h-[203px] w-full object-cover" />
    <div class="flex flex-col gap-1.5" style="padding: 20px">
      <span class="font-display text-[17px] font-bold leading-[1.24] tracking-[-.008em] text-ink">{{
        location().name
      }}</span>
      <span class="text-cap text-ink-3">{{ location().address }}</span>
      <span class="text-cap text-ink-3">{{ location().phone }} · {{ location().schedule }}</span>
      <span class="text-cap font-semibold text-gold-ink">{{ location().emergencyService }}</span>
      @if (mapHref(); as href) {
        <a
          [href]="href"
          class="relative mt-1.5 inline-flex w-fit items-center gap-2 text-[15px] font-bold text-blue-text after:absolute after:-inset-3.5 after:content-['']"
        >
          <app-icon name="location" [size]="16" />
          Ver mapa
        </a>
      }
    </div>
  </app-card>
}
