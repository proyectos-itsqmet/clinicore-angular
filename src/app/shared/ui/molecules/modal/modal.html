<dialog
  #dialog
  class="modal-dialog"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (click)="onDialogClick($event)"
  (close)="onClose()"
>
  <!-- El click del velo se detecta comparando el target con el propio
       `<dialog>`; cualquier click aca adentro lo frena este `stopPropagation`
       y no cierra nada por accidente. -->
  <div [class]="panelClasses()" (click)="$event.stopPropagation()">
    <div class="flex shrink-0 items-start gap-4 border-b border-line px-5 py-4 lg:px-6">
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <h2
          [id]="headingId"
          class="font-display text-[19px] font-extrabold leading-[1.22] tracking-[-.01em] text-ink"
        >
          {{ heading() }}
        </h2>
        @if (description(); as lead) {
          <p [id]="descriptionId" class="font-sans text-[13.5px] leading-[1.45] text-ink-3">
            {{ lead }}
          </p>
        }
      </div>

      <!-- La misma X que el drawer del shell: el sistema no tiene glifo de
           cerrar, tiene un `plus` girado 45 grados, y son el mismo dibujo. -->
      <button
        type="button"
        class="-mr-2 -mt-1 flex h-11 w-11 shrink-0 items-center justify-center rounded-tile-sm text-ink-3 transition-colors duration-150 ease-brand hover:bg-field hover:text-ink"
        aria-label="Cerrar"
        (click)="closeDialog()"
      >
        <app-icon name="plus" [size]="19" [strokeWidth]="2.1" class="rotate-45" />
      </button>
    </div>

    <!-- La UNICA region que scrollea. Cabecera y acciones quedan fijas, que es
         lo que evita que "Guardar" se pierda abajo en un formulario de siete
         campos a 390px. -->
    <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5 lg:px-6">
      <ng-content />
    </div>

    <div
      class="flex shrink-0 flex-col-reverse gap-2.5 border-t border-line px-5 py-4 sm:flex-row sm:justify-end lg:px-6"
    >
      <ng-content select="[modalActions]" />
    </div>
  </div>
</dialog>
