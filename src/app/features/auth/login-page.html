<!-- `min-h-dvh` y no `min-h-screen`: en un navegador movil con barras dinamicas
     `vh` miente, y esta es la unica pantalla del panel que puede crecer mas que
     la ventana cuando el teclado virtual sube. -->
<div class="flex min-h-dvh items-center justify-center bg-field px-4 py-10">
  <div
    class="flex w-full max-w-[420px] flex-col gap-6 rounded-card rounded-br-card-nub border border-line bg-surface p-6 shadow-lift-1 sm:p-8"
  >
    <!-- La misma marca que la barra del shell, al mismo tamano: entrar y estar
         adentro tienen que verse como el mismo producto. -->
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[10px] bg-blue">
          <span class="font-display text-[17px] font-extrabold text-surface">C</span>
        </span>
        <span class="font-display text-[20px] font-extrabold tracking-[-.012em] text-ink"
          >CliniCore</span
        >
      </span>

      <div class="flex flex-col gap-1.5">
        <h1
          class="font-display text-[24px] font-extrabold leading-[1.18] tracking-[-.014em] text-ink"
        >
          Ingreso al sistema
        </h1>
        <p class="font-sans text-[14px] leading-[1.5] text-ink-3">Panel administrativo</p>
      </div>
    </div>

    @if (error(); as message) {
      <app-inline-alert tone="error" [message]="message" (dismiss)="error.set(null)" />
    }

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-input-field
        label="Correo electrónico"
        type="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        [control]="form.controls.email"
        [messages]="messages.email"
      />
      <app-input-field
        label="Contraseña"
        type="password"
        autocomplete="current-password"
        [control]="form.controls.password"
        [messages]="messages.password"
      />

      <app-button
        variant="primary"
        size="md"
        type="submit"
        [fullWidth]="true"
        [disabled]="pending()"
      >
        {{ pending() ? 'Ingresando…' : 'Ingresar' }}
      </app-button>
    </form>
  </div>
</div>
