<!-- Alto minimo y no `h-full`: la region de contenido del shell scrollea, asi
     que una seccion real puede ser mas alta que la ventana. `min-h-` reserva la
     pantalla completa cuando hay poco, sin recortar cuando hay mucho. -->
<div class="flex min-h-[calc(100dvh-13rem)] flex-col gap-5 lg:min-h-[calc(100dvh-14rem)]">
  <!-- Mismo `app-page-header` que las secciones reales, sin acciones: un boton
       "Nuevo" en una seccion que no existe es peor que ninguno. Que el titulo
       salga del mismo componente es lo que hace que estrenar una seccion no
       cambie de tipografia a mitad de camino. -->
  <app-page-header [kicker]="group()" [heading]="title()" />

  <div
    class="flex min-h-0 flex-1 items-center justify-center rounded-card rounded-br-card-nub border border-line bg-surface p-6 shadow-lift-1 lg:p-7"
  >
    <div
      class="flex h-full w-full flex-col items-center justify-center gap-2.5 rounded-tile-lg border-2 border-dashed border-line px-5 py-10"
    >
      <span
        class="text-center font-sans text-[12px] font-bold uppercase tracking-[.14em] text-ink-3"
        >Contenido de la sección</span
      >
      <span class="max-w-[420px] text-center font-sans text-[14px] leading-[1.5] text-ink-3">
        {{ group() }} · {{ title() }}. El shell está listo; esta sección se diseña aparte.
      </span>
    </div>
  </div>
</div>
